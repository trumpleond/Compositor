name: Windows build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Select Visual Studio generator
        shell: pwsh
        run: |
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (-not (Test-Path $vswhere)) {
            throw 'vswhere.exe was not found on the Windows runner'
          }
          $version = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationVersion
          if (-not $version) {
            throw 'No Visual Studio installation with C++ tools was found'
          }
          $major = [int]($version.Split('.')[0])
          $generator = switch ($major) {
            18 { 'Visual Studio 18 2026' }
            17 { 'Visual Studio 17 2022' }
            16 { 'Visual Studio 16 2019' }
            default { throw "Unsupported Visual Studio major version: $major" }
          }
          "CMAKE_GENERATOR=$generator" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Using $generator ($version)"
      - name: Configure
        run: cmake -S . -B build -G "$env:CMAKE_GENERATOR" -A x64
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package Windows app
        shell: pwsh
        run: Compress-Archive -Path build/Release/Compositor.exe -DestinationPath Compositor-Windows-x64.zip
      - name: Upload Windows app
        uses: actions/upload-artifact@v4
        with:
          name: Compositor-Windows-x64
          path: Compositor-Windows-x64.zip
